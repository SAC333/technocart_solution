<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ledger</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">Inventory</p>
        <h1>Ledger</h1>
      </div>
      <p class="total" id="total-count">0 titles</p>
    </div>
  </header>
  <nav class="nav">
    <a class="nav-link" href="#books">Books</a>
  </nav>
  <main>
    <section class="stats" id="stats"></section>
    <section class="panel" id="books">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Search title, author, or ISBN" aria-label="Search books">
        <select id="category" aria-label="Category">
          <option value="">All categories</option>
        </select>
        <button type="button" id="add-book">Add book</button>
      </div>
      <div class="table-wrap">
        <table class="books-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Author</th>
              <th>Category</th>
              <th>Year</th>
              <th>Price</th>
              <th>Qty</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="book-rows"></tbody>
        </table>
      </div>
      <p id="message" class="message" role="alert"></p>
    </section>
  </main>
  <dialog id="book-dialog">
    <form id="book-form">
      <h2 id="form-title">Add book</h2>
      <label>Title<input name="title" required></label>
      <label>Author<input name="author" required></label>
      <label>ISBN<input name="isbn" required></label>
      <label>Category<input name="category" required></label>
      <label>Year<input name="published_year" type="number" required></label>
      <label>Price<input name="price" type="number" min="0" step="0.01" required></label>
      <label>Quantity<input name="quantity" type="number" min="0" step="1" required></label>
      <div class="form-actions">
        <button type="button" id="cancel-form">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </dialog>
  <script src="/js/app.js"></script>
</body>
</html>
